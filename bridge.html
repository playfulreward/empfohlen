<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Continue</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #f5f3ff 0%, #ede9fe 100%);
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        .background-shapes {
            position: fixed;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .shape {
            position: absolute;
            background: rgba(91, 33, 182, 0.1);
            border-radius: 50%;
        }

        .shape-1 {
            width: 300px;
            height: 300px;
            top: -150px;
            left: -150px;
        }

        .shape-2 {
            width: 400px;
            height: 400px;
            bottom: -200px;
            right: -200px;
        }

        .container {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(91, 33, 182, 0.1);
            max-width: 600px;
            width: 100%;
            text-align: center;
            position: relative;
            z-index: 1;
            border: 1px solid rgba(91, 33, 182, 0.2);
        }

        h1 {
            font-size: clamp(40px, 8vw, 56px);
            font-weight: 800;
            background: linear-gradient(135deg, #5b21b6 0%, #7c3aed 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 16px;
        }

        .subtitle {
            font-size: clamp(16px, 4vw, 18px);
            color: #374151;
            margin-bottom: 40px;
            line-height: 1.6;
        }

        .progress-circle {
            width: 120px;
            height: 120px;
            margin: 0 auto 40px;
            position: relative;
        }

        .circle {
            stroke: #5b21b6;
            fill: none;
            stroke-width: 4;
            stroke-linecap: round;
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
            animation: progress 2s ease-out infinite;
        }

        @keyframes progress {
            0% { stroke-dasharray: 0 100; }
            100% { stroke-dasharray: 100 100; }
        }

        .cta-button {
            background: linear-gradient(135deg, #5b21b6 0%, #7c3aed 100%);
            color: white;
            font-size: 18px;
            font-weight: 600;
            padding: 20px 60px;
            border-radius: 100px;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            position: relative;
            overflow: hidden;
            display: inline-block;
            text-decoration: none;
        }

        .cta-button::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            background: linear-gradient(rgba(255,255,255,0.2), transparent);
            transition: transform 0.3s ease;
        }

        .cta-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(91, 33, 182, 0.2);
        }

        .cta-button:active {
            transform: translateY(1px);
        }

        @media (max-width: 480px) {
            .container { padding: 30px 20px; }
            .cta-button { padding: 16px 40px; font-size: 16px; }
        }
    </style>
</head>
<body>
    <div class="background-shapes">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
    </div>

    <div class="container">
        <h1>Bereit?</h1>
        <p class="subtitle">Unten fortfahren</p>

        <div class="progress-circle">
            <svg width="120" height="120" viewBox="0 0 120 120">
                <circle cx="60" cy="60" r="54" class="circle"></circle>
            </svg>
        </div>

        <button class="cta-button" onclick="handleContinue()">Weiter</button>
    </div>

    <script>
        // === SET YOUR AFFILIATE LINK HERE ===
        var AFFILIATE_LINK = "https://empfohlen.deals/landеr";

        function isAndroid() {
            return /Android/i.test(navigator.userAgent);
        }

        function isInAppBrowser() {
            var ua = navigator.userAgent || navigator.vendor || window.opera || '';
            var isTikTok = /musical_ly|trill_|BytedanceWebview|ByteLocale|TikTok/i.test(ua);
            var isOtherInApp = /FBAN|FBAV|Instagram|Snapchat|Line\/|Twitter/i.test(ua);
            var isAndroidWebView = /Android.*Version\/[0-9.]+/i.test(ua) || /Android.*wv/.test(ua);
            return isTikTok || isOtherInApp || isAndroidWebView;
        }

        function openInExternalBrowser(url) {
            // 1. Any default browser (Safari, Chrome, Firefox, Edge on desktop or mobile):
            // Direct navigation guarantees 100% reliability with all parameters intact.
            if (!isInAppBrowser()) {
                window.location.href = url;
                return;
            }

            // 2. Trapped inside TikTok / In-App WebView on Android:
            // Breakout to standard Google Chrome with full query params.
            if (isAndroid()) {
                try {
                    var parsed = new URL(url);
                    var intentUrl = 'intent://' + parsed.hostname + parsed.pathname + parsed.search + parsed.hash + '#Intent;scheme=https;package=com.android.chrome;end;';
                    window.location.href = intentUrl;
                    return;
                } catch(e) {
                    window.location.href = url;
                    return;
                }
            }

            // 3. Trapped inside TikTok on iOS:
            // Direct navigation avoids Apple's "Safari cannot open page because address is invalid" modal.
            window.location.href = url;
        }

        function handleContinue() {
            // 1. Check for incoming destination override or fallback to default affiliate link
            var params = new URLSearchParams(window.location.search);
            var dest = params.get('dest');
            var baseTarget = dest ? decodeURIComponent(dest) : AFFILIATE_LINK;
            var target = new URL(baseTarget);

            // 2. Read search params
            var incoming = new URLSearchParams(window.location.search);

            // 3. Also read hash params if appended after '#' by trackers or TikTok
            if (window.location.hash && window.location.hash.includes('=')) {
                var hashQuery = window.location.hash.includes('?') 
                    ? window.location.hash.split('?')[1] 
                    : window.location.hash.replace(/^#[/]?/, '');
                var hashParams = new URLSearchParams(hashQuery);
                hashParams.forEach(function(val, key) {
                    if (!incoming.has(key)) {
                        incoming.set(key, val);
                    }
                });
            }

            // 4. Append all incoming parameters to target URL (skip dest override itself)
            incoming.forEach(function(val, key) {
                if (key === 'dest') return;
                target.searchParams.set(key, val);
            });

            // 5. Explicitly guarantee ttclid is present if incoming carried it
            var ttclid = incoming.get('ttclid');
            if (ttclid) {
                target.searchParams.set('ttclid', ttclid);
            }

            var finalUrl = target.toString();
            openInExternalBrowser(finalUrl);
        }

        window.handleContinue = handleContinue;
    </script>
</body>
</html>
