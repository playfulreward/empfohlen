
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting...</title>
  <script>
    (function () {
      const iosURL = "https://apps.apple.com/de/app/empfohlen-de-geld-verdienen/id6741855114";
      const androidURL = "https://play.google.com/store/apps/details?id=de.emex.empfohlen&hl=en_US";
      const desktopURL = "https://www.empfohlen.de/";

      const ua = navigator.userAgent;

      if (/iPhone|iPad|iPod/i.test(ua) ||
          (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1)) {
        window.location.replace(iosURL);
      } else if (/Android/i.test(ua)) {
        window.location.replace(androidURL);
      } else {
        window.location.replace(desktopURL);
      }
    })();
  </script>
</head>
<body>
</body>
</html>
